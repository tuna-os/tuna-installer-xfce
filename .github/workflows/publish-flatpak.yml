name: Publish Flatpak
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-oci:
    name: Build Flatpak OCI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/org.tunaos.InstallerXfce.json
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: false
          upload-artifact: false
      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=x86_64 repo tuna-installer-xfce.oci org.tunaos.InstallerXfce
      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: tuna-installer-xfce-oci
          path: tuna-installer-xfce.oci/
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: build-oci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tuna-installer-xfce-oci
          path: tuna-installer-xfce.oci
      - name: Push OCI to GHCR
        run: |
          echo "${{ env.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:tuna-installer-xfce.oci docker://ghcr.io/tuna-os/tuna-installer-xfce:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update central index (tuna-os/docs)
        uses: tuna-os/.github/.github/actions/publish-flatpak-index@main
        with:
          oci-dir: tuna-installer-xfce.oci
          repo-name: tuna-os/tuna-installer-xfce
          tags: latest
          token: ${{ secrets.FLATPAK_INDEX_TOKEN }}
